name: Build duola images (GHCR)

# 构建并推送 duola 前后端镜像到 ghcr.io/dabao9037，版本号与 docker-build.yml 保持一致
env:
  VERSION: "1.4.3"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "springboot-backend/**"
      - "vite-frontend/**"
      - ".github/workflows/duola-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: duola-frontend
            context: ./vite-frontend
          - name: duola-backend
            context: ./springboot-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/dabao9037/${{ matrix.name }}:${{ env.VERSION }}
            ghcr.io/dabao9037/${{ matrix.name }}:latest
